name: Verify

# The repository had no CI, which is how `gradlew` came to be committed without its
# executable bit: every documented command was PowerShell (`.\gradlew.bat`), so nothing ever
# ran `./gradlew` on Linux. This workflow runs the whole gate from TESTING.md on a clean
# checkout, which also keeps that bit honest.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: JVM tests, lint and APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if gradlew is not executable
        run: |
          # git ls-files reports the committed mode, not the working-tree mode, so this
          # catches the bit being lost again even on a runner that would tolerate it.
          mode="$(git ls-files -s gradlew | cut -d' ' -f1)"
          echo "committed mode: $mode"
          test "$mode" = "100755" || {
            echo "::error file=gradlew::gradlew must be committed executable (100755); run: git update-index --chmod=+x gradlew"
            exit 1
          }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests, lint, debug and release APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  guards:
    name: Guard syntax, decision rules and DOM behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Guard syntax
        run: node tools/check-guard-syntax.js

      - name: Guard decision rules
        run: node tools/guard-fixture-tests.js

      - name: Guard behaviour in a real DOM
        run: node tools/guard-dom-tests.js
